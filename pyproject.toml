[project]
name = "myapp"
version = "0.1.0"
description = "SAM full-stack starter — FastAPI-in-Lambda + Vite SPA on CloudFront"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "mangum>=0.19",
    "pydantic>=2.7",
    "email-validator>=2.1",
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "python-multipart>=0.0.9",
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
